<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Donkey body - based on the reference image but without a tail -->
  <g id="donkey">
    <!-- Body -->
    <path d="M 400,300 C 500,280 550,320 580,380 C 610,440 590,500 520,520 C 450,540 380,530 340,480 C 300,430 320,320 400,300 Z" fill="#A0522D" stroke="#000000" stroke-width="3"/>
    
    <!-- Head -->
    <path d="M 400,300 C 380,280 350,270 320,280 C 290,290 270,320 260,350 C 250,380 260,410 280,430 C 300,450 330,450 350,430 C 370,410 390,330 400,300 Z" fill="#A0522D" stroke="#000000" stroke-width="3"/>
    
    <!-- Ears -->
    <path d="M 320,280 C 310,250 290,230 270,240 C 250,250 240,270 250,290 C 260,310 280,300 290,290 Z" fill="#C19A6B" stroke="#000000" stroke-width="2"/>
    <path d="M 330,270 C 330,240 340,220 360,210 C 380,200 400,210 410,230 C 420,250 400,270 380,280 Z" fill="#C19A6B" stroke="#000000" stroke-width="2"/>
    
    <!-- Eyes -->
    <ellipse cx="290" cy="350" rx="8" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <ellipse cx="290" cy="350" rx="4" ry="6" fill="#000000"/>
    
    <!-- Nose -->
    <ellipse cx="260" cy="380" rx="15" ry="10" fill="#000000"/>
    
    <!-- Mouth -->
    <path d="M 260,390 C 270,400 290,405 310,400" fill="none" stroke="#000000" stroke-width="2"/>
    
    <!-- Legs -->
    <path d="M 520,520 C 530,550 535,580 530,600" fill="none" stroke="#000000" stroke-width="5"/>
    <path d="M 480,530 C 485,560 480,580 475,600" fill="none" stroke="#000000" stroke-width="5"/>
    <path d="M 380,480 C 375,520 370,560 365,600" fill="none" stroke="#000000" stroke-width="5"/>
    <path d="M 340,480 C 330,520 320,560 310,600" fill="none" stroke="#000000" stroke-width="5"/>
    
    <!-- Hooves -->
    <ellipse cx="530" cy="600" rx="10" ry="5" fill="#000000"/>
    <ellipse cx="475" cy="600" rx="10" ry="5" fill="#000000"/>
    <ellipse cx="365" cy="600" rx="10" ry="5" fill="#000000"/>
    <ellipse cx="310" cy="600" rx="10" ry="5" fill="#000000"/>
    
    <!-- Note: No tail is included as per requirements -->
  </g>
  
  <!-- Text label -->
  <text x="400" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#000000">Pin the Tail on the Donkey</text>
</svg>